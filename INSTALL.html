<h1>My Life OS PWA V0.1</h1>
<p>项目已经包含 PWA manifest、主屏幕图标、standalone 模式和离线 Service Worker。</p>
<h2>装到 iPhone</h2>
<p>先把整个文件夹免费部署到一个 HTTPS 静态网站，然后使用 Safari 打开网址 → 分享 → <b>添加到主屏幕</b>。</p>
<h2>为什么不能直接从文件安装</h2>
<p>iOS 的 PWA 安装依赖 HTTPS 和 Service Worker。本地 <code>index.html</code> 可以预览，但不能完整作为 PWA 安装。</p>
