</style></head><body>
<div id="heartbeat">v3.0 · Rebuilt UI</div><main id="app"></main><button id="searchFloat" class="searchFloat" data-act="search">⌕</button><button id="focusFloat" class="focusFloat" data-act="focus">◎<span>Focus</span></button><nav id="nav" class="nav"><button data-page="today"><span>🏠</span><b>Today</b></button><button data-page="plan"><span>📋</span><b>Plan</b></button><button id="quickBtn" class="plus">＋</button><button data-page="life"><span>📔</span><b>Life</b></button><button data-page="archive"><span>🗃️</span><b>Archive</b></button></nav><div id="overlay" class="overlay hidden"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>(()=>{'use strict';

if(h.type==='flex'){if(!rs.length)return '可以做';const gap=Math.floor((new Date(today())-new Date(rs[0].date))/86400000),early=Number(h.early||2),ideal=Number(h.ideal||3),late=Number(h.late||5);if(gap<early)return '刚完成';if(gap<ideal)return '可以做';if(gap<=late)return '建议今天';return `距上次 ${gap} 天`}

function routineDue(r){if(r.archived)return false;if(!r.days?.length)return true;return r.days.includes(new Date().getDay())}

function routineRec(rid){let r=data.routineRecords.find(x=>x.routineId==rid&&x.date===today());if(!r){r={id:id(),routineId:Number(rid),date:today(),doneSteps:[]};data.routineRecords.push(r)}return r}

function renderToday(){const ps=data.plans.filter(p=>p.start<=today()&&p.end>=today()), hs=data.habits.filter(h=>!h.archived), doneN=hs.filter(h=>doneOn(h.id)).length, memos=[...data.memos].filter(m=>!m.done).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));app.innerHTML=`<section class="page">${header('Today',new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}))}<div class="section"><div class="label"><span>MY DAY</span><span>今天</span></div><div class="card">${rows(data.routines.filter(r=>routineDue(r)),'今天还没有 Routine。',r=>{const rr=data.routineRecords.find(x=>x.routineId==r.id&&x.date===today()),n=rr?.doneSteps?.length||0,total=r.steps?.length||0;return `<div class="row"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.time||'未设时间')} · ${n}/${total}</div></div><button class="btn" data-openroutine="${r.id}">${n?'继续':'开始'}</button></div>`})}</div></div><div class="section"><div class="label"><span>今日计划</span><span>${ps.length}</span></div><div class="card">${rows(ps,'今天还没有计划。',p=>planRow(p))}</div></div><div class="section"><div class="label"><span>HABIT</span><span>${doneN} / ${hs.length} 已完成</span></div><div class="habitprogress"><i style="width:${hs.length?Math.round(doneN/hs.length*100):0}%"></i></div><div class="card">${rows(hs,'还没有建立习惯。',h=>`<div class="row"><div><b>${esc(h.title)}</b><div class="muted">${fmtCycle(h)} · ${habitStatus(h)}</div></div><button class="check ${doneOn(h.id)?'done':''}" data-checkhabit="${h.id}"></button></div>`)}</div></div><div class="section"><div class="label"><span>MEMO</span><button class="btn" data-act="addmemo">＋ 备忘</button></div><div class="card">${rows(memos,'没有未完成的备忘。',m=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><button class="check" data-donememo="${m.id}"></button><div><b>${m.pinned?'⌖ ':''}${esc(m.text)}</b>${m.date?`<div class="muted">${m.date}</div>`:''}</div></div><button class="btn" data-editmemo="${m.id}">编辑</button></div>`)}</div><button class="memoarchive" data-act="memolist">查看全部备忘</button></div></section>`}
function planFocusMinutes(pid,dayOnly=false){return data.focusSessions.filter(x=>x.linkType==='plan'&&x.linkedId==pid&&(!dayOnly||x.date===today())).reduce((s,x)=>s+Number(x.minutes||0),0)}

<div class="card"><div class="row"><button class="icon" data-month="-1">‹</button><b>${y}年${m+1}月</b><button class="icon" data-month="1">›</button></div><div class="cal">${c}</div></div>

function nextAnnivDays(ds){const now=new Date(), parts=ds.split('-').map(Number);let d=new Date(now.getFullYear(),parts[1]-1,parts[2]);d.setHours(0,0,0,0);const t=new Date();t.setHours(0,0,0,0);if(d<t)d.setFullYear(d.getFullYear()+1);return Math.round((d-t)/86400000)}

 const nums=vals.map(Number),mn=Math.min(...nums),mx=Math.max(...nums),span=mx-mn||1;
 const pts=nums.map((v,i)=>`${10+(w-20)*(i/(Math.max(1,nums.length-1)))},${h-10-(h-20)*(v-mn)/span}`).join(' ');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
