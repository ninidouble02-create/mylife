<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FBF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Life OS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>My Life OS v0.8</title>
<style>
:root{--bg:#FBF8F2;--surface:#FFFDF9;--text:#26251F;--muted:#8C877E;--line:#E8E2D9;--accent:#8D967A;--soft:#EEF0E9;--warm:#F1EAE0;--danger:#B66B63;--radius:19px;--shadow:0 8px 28px rgba(56,48,38,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:430px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(98px + env(safe-area-inset-bottom))}
.view{display:none}.view.active{display:block}
.topbar{height:48px;display:flex;align-items:center;justify-content:space-between}
.iconbtn{border:0;background:transparent;color:var(--text);font-size:21px;padding:8px 4px}
h1{font-size:34px;line-height:1.06;letter-spacing:-1px;margin:10px 0 5px}h2{margin:0}
.sub{font-size:14px;color:var(--muted);margin-bottom:18px}.muted{color:var(--muted);font-size:13px}
.section{margin:18px 0}.section-title{display:flex;align-items:center;justify-content:space-between;padding:0 3px 8px;font-size:12px;letter-spacing:.075em;color:var(--muted);text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.row{min-height:47px;display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{border-top:1px solid var(--line)}
.left{display:flex;align-items:center;gap:10px;min-width:0}.grow{flex:1;min-width:0}
.badge,.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:12px}.badge{background:var(--soft);color:#626956}.pill{background:var(--warm);color:#665F54}
.action{border:0;background:var(--warm);border-radius:999px;padding:8px 11px;font-size:12px;color:var(--text)}
.primary,.secondary,.danger{width:100%;border-radius:15px;padding:13px;font-weight:650}
.primary{border:0;background:var(--text);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}.danger{border:1px solid #ead3d0;background:#fff5f3;color:var(--danger)}
.check{width:23px;height:23px;border-radius:50%;border:1.5px solid #B8B1A7;background:#fff;display:grid;place-items:center;flex:0 0 auto}.check.done{background:var(--accent);border-color:var(--accent);color:#fff}.check.done::after{content:"✓";font-size:14px}
.progress{height:5px;background:#ECE7DE;border-radius:999px;overflow:hidden;margin:11px 0 7px}.progress span{height:100%;display:block;background:var(--accent)}
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100vw);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 9px calc(8px + env(safe-area-inset-bottom));background:rgba(251,248,242,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 0}.nav button.active{color:var(--text);font-weight:700}.nav .plus{width:52px;height:52px;border-radius:50%;margin:-22px auto 0;background:var(--text);color:#fff;font-size:29px;box-shadow:0 9px 22px rgba(0,0,0,.16)}
.quickadd{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(398px,calc(100vw - 24px));background:rgba(255,253,249,.98);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:25px;padding:14px;box-shadow:0 18px 55px rgba(45,40,32,.18);display:none}.quickadd.show{display:block}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.qitem{min-height:72px;border:1px solid var(--line);background:#fff;border-radius:15px;color:var(--text);padding:9px 6px;text-align:center}.qitem span{display:block;font-size:21px;margin-bottom:4px}
.sheet{position:fixed;z-index:50;inset:0;background:rgba(30,27,23,.25);display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}.sheet-card{width:min(430px,100vw);max-height:88vh;overflow:auto;background:var(--surface);border-radius:27px 27px 0 0;padding:18px 18px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.12)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head h2{font-size:21px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);padding:12px;outline:none}.field textarea{min-height:96px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segment{display:flex;background:#F1ECE4;padding:4px;border-radius:13px;gap:4px}.segment button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 5px;color:var(--muted);font-size:12px}.segment button.active{background:#fff;color:var(--text);font-weight:650}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:left}.dow{font-size:10px;color:var(--muted);padding:0 2px 5px;text-align:center}.day{min-height:92px;padding:5px 3px;border-radius:8px;position:relative;font-size:11px;background:#fff;border:1px solid #eee8df;overflow:hidden}.daynum{font-weight:750;font-size:12px;margin-bottom:4px}.day.today{outline:1.5px solid var(--accent)}.day.selected{outline:2px solid var(--text)}.cal-event{display:block;border-radius:4px;padding:2px 3px;margin:2px 0;font-size:9px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#e8efe0}.cal-event:nth-of-type(3n+1){background:#f8e2e8}.cal-event:nth-of-type(3n+2){background:#e3eff7}.cal-event.done{text-decoration:line-through;opacity:.55}.cal-more{font-size:9px;color:var(--muted);padding:1px 3px}.photo-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.photo-day{aspect-ratio:.82;border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden;position:relative;min-width:0}.photo-day .n{position:absolute;z-index:2;top:3px;left:4px;background:rgba(255,255,255,.82);border-radius:5px;padding:1px 3px;font-size:9px}.photo-day img{width:100%;height:100%;object-fit:cover}.photo-day .count{position:absolute;right:3px;bottom:3px;background:rgba(30,27,23,.7);color:#fff;border-radius:999px;padding:1px 4px;font-size:8px}.photo-empty{display:grid;place-items:center;color:#bbb;font-size:9px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.photo-thumb{aspect-ratio:1;border-radius:13px;overflow:hidden;background:#eee7dd}.photo-thumb img,.life-photo,.receipt-photo{width:100%;height:100%;object-fit:cover;display:block}.life-photo{height:auto;max-height:390px;border-radius:15px;margin-top:10px}.receipt-photo{height:auto;max-height:330px;border-radius:14px;margin-top:10px}
.life-item{padding:15px 0}.life-item+.life-item{border-top:1px solid var(--line)}.life-time{font-size:12px;color:var(--muted);margin-bottom:6px}.tag{display:inline-block;background:#F1ECE4;border-radius:999px;padding:5px 8px;font-size:11px;margin:6px 4px 0 0}.location{font-size:12px;color:var(--muted);margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat strong{font-size:22px;display:block;margin:3px 0}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.moodbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;text-align:center}.moodbtn.active{background:var(--soft);border-color:#C9D0BD}.moodbtn b{display:block;font-size:24px;margin-bottom:3px}
.focus-float{position:fixed;z-index:38;right:max(15px,calc((100vw - 430px)/2 + 15px));bottom:calc(91px + env(safe-area-inset-bottom));display:none;border:0;border-radius:999px;background:var(--text);color:#fff;padding:11px 14px;box-shadow:0 10px 28px rgba(0,0,0,.18)}.focus-float.show{display:block}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 0}.bar-wrap{flex:1;text-align:center;font-size:9px;color:var(--muted)}.bar{width:100%;min-height:3px;background:var(--accent);border-radius:6px 6px 2px 2px;margin-bottom:5px}
.empty{padding:16px 4px;color:var(--muted);text-align:center;font-size:13px}.note{font-size:12px;color:var(--muted);line-height:1.55}.title-sm{font-weight:700}.divider{height:1px;background:var(--line);margin:13px 0}.hidden{display:none}
.toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));background:#292722;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<section id="today" class="view active">
  <div class="topbar"><button class="iconbtn" onclick="openMySpace()">☰</button><button class="iconbtn" onclick="openBackup()">⋯</button></div>
  <h1>Today</h1><div id="todayDate" class="sub"></div>
  <div class="section"><div class="section-title"><span>My Day</span><span id="routineDayBadge" class="badge">今天</span></div><div id="todayRoutine" class="card"></div></div>
  <div class="section"><div class="section-title"><span>今日计划</span><span id="todayPlanCount"></span></div><div id="todayPlans" class="card"></div></div>
  <div class="section"><div class="section-title"><span>Habit</span><span>今天</span></div><div id="todayHabits" class="card"></div></div>
  <div class="section"><div class="section-title"><span>Mood</span><span>今日代表心情</span></div><div class="card"><div class="row"><div><strong id="todayMoodText">还没记录</strong><div class="muted">点右边打卡，可修改</div></div><button class="action" onclick="openMood()">打卡</button></div></div></div>
  <div class="section"><div class="section-title"><span>轻提醒</span><span></span></div><div id="todayReminders" class="card"></div></div>
</section>

<section id="plan" class="view">
 <div class="topbar"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><button class="iconbtn" onclick="openPlanForm()">＋</button></div>
 <h1>Plan</h1><div class="sub">月视图 · 计划 · Plan Pool · 纪念日</div>
 <div class="card">
   <div class="row"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button class="iconbtn" onclick="changeMonth(1)">›</button></div>
   <div id="monthCalendar" class="calendar"></div>
 </div>
 <div class="section"><div class="section-title"><span id="selectedDateTitle">所选日期</span><span></span></div><div id="selectedDatePlans" class="card"></div></div>
 <div class="section"><div class="section-title"><span>Plan Pool</span><span id="poolCount"></span></div><div id="planPool" class="card"></div></div>
 <div class="section"><div class="section-title"><span>Anniversary</span><span id="annivCount"></span></div><div id="annivList" class="card"></div></div>
</section>

<section id="life" class="view">
 <div class="topbar"><button class="iconbtn" onclick="openMySpace()">☰</button><button class="iconbtn" onclick="openLifeForm()">＋</button></div>
 <h1>Life</h1><div class="sub">私人生活流 · 文字 · 照片 · 地点 · 标签</div>
 <div class="segment" style="margin-bottom:15px"><button id="lifeTabTimeline" class="active" onclick="setLifeMode('timeline')">Timeline</button><button id="lifeTabPhotos" onclick="setLifeMode('photos')">Photos</button><button id="lifeTabDrinks" onclick="setLifeMode('drinks')">Drinks</button></div>
 <div id="lifeFeed"></div>
</section>

<section id="archive" class="view">
 <div class="topbar"><button class="iconbtn" onclick="archiveMonth(-1)">‹</button><button class="iconbtn" onclick="archiveMonth(1)">›</button></div>
 <h1>Archive</h1><div id="archiveTitle" class="sub"></div>
 <div id="archiveStats" class="stats"></div>
 <div class="section"><div class="section-title"><span>月历</span><span>Plan · Life · Mood</span></div><div id="archiveCalendar" class="calendar"></div></div>
 <div class="section"><div class="section-title"><span>本月照片</span><span id="archivePhotoCount"></span></div><div id="archivePhotos" class="card"></div></div>
 <div class="section"><div class="section-title"><span>Mood</span><span>月度分布</span></div><div id="archiveMoods" class="card"></div></div>
 <div class="section"><div class="section-title"><span>这个月的我</span><span></span></div><div class="card"><textarea id="monthNote" style="width:100%;min-height:100px;border:0;background:transparent;outline:none;resize:vertical" placeholder="写一点这个月的回顾……" onblur="saveMonthNote()"></textarea></div></div>
</section>
</div>

<button id="focusFloat" class="focus-float" onclick="openRunningFocus()">⏱ <span id="focusFloatTime">00:00</span></button>

<div id="quickAdd" class="quickadd">
 <div class="section-title"><span>快速添加</span><button class="iconbtn" style="font-size:17px" onclick="toggleQuick()">×</button></div>
 <div class="quick-grid">
  <button class="qitem" onclick="openMoneyForm()"><span>💰</span>记一笔</button>
  <button class="qitem" onclick="openLifeForm()"><span>💭</span>Life</button>
  <button class="qitem" onclick="openWeightForm()"><span>⚖️</span>体重</button>
  <button class="qitem" onclick="openPlanForm()"><span>📅</span>计划</button>
  <button class="qitem" onclick="openDrinkForm()"><span>🧋</span>饮品</button>
  <button class="qitem" onclick="openFocusForm()"><span>⏱</span>专注</button>
  <button class="qitem" onclick="openMood()"><span>🙂</span>心情</button>
  <button class="qitem" onclick="openExerciseForm()"><span>🏃</span>运动</button>
  <button class="qitem" onclick="openSleepForm()"><span>🌙</span>睡眠</button>
 </div>
</div>

<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetCard" class="sheet-card"></div></div>
<div id="toast" class="toast"></div>

<nav class="nav">
 <button data-view="today" class="active" onclick="switchView('today')">⌂<br>Today</button>
 <button data-view="plan" onclick="switchView('plan')">▣<br>Plan</button>
 <button class="plus" onclick="toggleQuick()">＋</button>
 <button data-view="life" onclick="switchView('life')">◌<br>Life</button>
 <button data-view="archive" onclick="switchView('archive')">▤<br>Archive</button>
</nav>

<script>
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const todayKey=()=>dateKey(new Date());
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=s=>new Date(s+'T00:00:00');
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const days=(a,b)=>Math.round((dayStart(b)-dayStart(a))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>Date.now()+Math.floor(Math.random()*10000);
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function showSheet(h){sheetCard.innerHTML=h;sheet.classList.add('show');quickAdd.classList.remove('show')}
function closeSheet(){sheet.classList.remove('show')}
function toggleQuick(){quickAdd.classList.toggle('show')}
function saveAll(){
 const data={plans,planPool,routines,habits,habitLogs,moods,life,money,moneyCategories,budgets,health,anniversaries,knowledge,focusRecords};
 Object.entries(data).forEach(([k,v])=>S.set(k,v));
}
function normalize(){
 // migrate old data without creating mysterious blank plans
 plans=(plans||[]).filter(p=>p&&String(p.title||'').trim()).map(p=>({...p,startDate:p.startDate||todayKey(),endDate:p.endDate||p.startDate||todayKey(),done:!!p.done,focus:p.focus!==false}));
 planPool=(planPool||[]).filter(p=>p&&String(p.title||'').trim());
 routines=(routines||[]).map(r=>({...r,time:r.time||'07:00',repeat:r.repeat||'daily',days:r.days||[],steps:(r.steps||[]).map((s,i)=>typeof s==='string'?{id:uid()+i,title:s}:s)}));
 habits=(habits||[]).map(h=>({...h,type:h.type||'fixed',period:h.period||'daily',target:Number(h.target||h.goal||1),minGap:Number(h.minGap||2),idealGap:Number(h.idealGap||3),maxGap:Number(h.maxGap||4),active:h.active!==false}));
 life=(life||[]).filter(x=>x&&((x.text||'').trim()||(x.photoIds||[]).length||x.type==='drink'||x.type==='anniversary'));
}
let plans=S.get('plans',[]);
let planPool=S.get('planPool',[]);
let routines=S.get('routines',[]);
let habits=S.get('habits',[]);
let habitLogs=S.get('habitLogs',[]);
let moods=S.get('moods',[]);
let life=S.get('life',[]);
let money=S.get('money',[]);
let moneyCategories=S.get('moneyCategories',['餐饮','饮品','购物','交通','美妆护肤','娱乐','医疗','生活缴费','学习','旅行','其他']);
let budgets=S.get('budgets',{monthly:3000,categories:{}});
let health=S.get('health',{weight:[],periods:[],exercise:[],sleep:[],steps:[]});
let anniversaries=S.get('anniversaries',[]);
let knowledge=S.get('knowledge',[]);
let focusRecords=S.get('focusRecords',S.get('focus',[]));
let monthNotes=S.get('monthNotes',{});
normalize();saveAll();

const PhotoDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((ok,no)=>{const r=indexedDB.open('MyLifeOSPhotos',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return this.db},async put(blob){const db=await this.open(),id='p_'+uid();return new Promise((ok,no)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({id,blob});tx.oncomplete=()=>ok(id);tx.onerror=()=>no(tx.error)})},async get(id){const db=await this.open();return new Promise((ok,no)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>ok(r.result?.blob||null);r.onerror=()=>no(r.error)})}};
const photoUrls={};async function photoURL(id){if(photoUrls[id])return photoUrls[id];const b=await PhotoDB.get(id);if(!b)return'';return photoUrls[id]=URL.createObjectURL(b)}
async function saveFiles(inputId){const fs=[...(document.getElementById(inputId)?.files||[])],ids=[];for(const f of fs)ids.push(await PhotoDB.put(f));return ids}
async function photoHtml(ids=[],cls='life'){const us=[];for(const id of ids){const u=await photoURL(id);if(u)us.push(u)}if(!us.length)return'';if(us.length===1)return`<img class="${cls==='receipt'?'receipt-photo':'life-photo'}" src="${us[0]}">`;return`<div class="photo-grid">${us.map(u=>`<div class="photo-thumb"><img src="${u}"></div>`).join('')}</div>`}

// v0.8 migration: remove old demo Routine/Habit records; never auto-create undeletable samples
if(!S.get('v05DemoCleaned',false)){
 routines=routines.filter(r=>!(r.id===1&&r.title==='Morning'));
 habits=habits.filter(h=>!([21,22,23].includes(h.id)&&['阅读','运动','面膜'].includes(h.title)));
 habitLogs=habitLogs.filter(l=>habits.some(h=>h.id===l.habitId));
 S.set('v05DemoCleaned',true);
}
saveAll();

let selectedPlanDate=todayKey(),planMonth=new Date(),archiveDate=new Date(),lifeMode='timeline',photoMonth=new Date();
let focusState=S.get('focusState',null),focusTimer=null;
// Explicitly bind every id used by the app. Do not rely on Safari creating window globals for element IDs.
const DOM_IDS=['sheetCard','sheet','quickAdd','todayDate','todayRoutine','todayPlans','todayPlanCount','todayHabits','todayMoodText','todayReminders','monthTitle','monthCalendar','selectedDateTitle','selectedDatePlans','planPool','poolCount','lifeFeed','archiveTitle','archiveStats','archiveCalendar','archiveMoods','archivePhotoCount','archivePhotos','annivCount','annivList','focusFloat','focusFloatTime','rfTitle','rfTime','rfRepeat','rfDaysBox','rfSteps','hfTitle','hfType','hfPeriod','hfTarget','hfMin','hfIdeal','hfMax','normalHabitFields','flexHabitFields','pfTitle','pfStart','pfEnd','poolTitle','poolEditTitle','poolDate','moodNote','lfText','lfDate','lfTime','lfLocation','lfTags','mfType','mfAmount','mfCategory','mfDate','mfMerchant','mfNote','newCategory','budgetMonthly','wfDate','wfValue','perStart','perEnd','perNote','exDate','exType','exMin','slDate','slHours','slQuality','stDate','stValue','kfTitle','kfContent','kfTags','dfName','dfBrand','dfPrice','dfRating','dfLocation','dfNote','afTitle','afDate','afMode','afRepeat','afCalendar','afRemind','monthNote','receiptArea','searchResult'];
// v0.8: stable DOM access. Dynamic sheet fields may not exist at startup, so expose getters rather than cached elements.
DOM_IDS.forEach(id=>{
  try{Object.defineProperty(window,id,{configurable:true,get(){return document.getElementById(id)}})}catch(e){}
});
const td=document.getElementById('todayDate');
if(td) td.textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
window.addEventListener('error',e=>{console.error('My Life OS runtime error',e.error||e.message)});

function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));quickAdd.classList.remove('show');render();scrollTo(0,0)}
function render(){
  // One module failing must not break the rest of the app.
  const jobs=[renderToday,renderPlan,renderLife,renderArchive,resumeFocus];
  jobs.forEach(fn=>{try{const r=fn();if(r&&typeof r.catch==='function')r.catch(err=>console.error(fn.name,err))}catch(err){console.error(fn.name,err)}});
}
function occursOnPlan(p,d){return p.startDate<=d && (p.endDate||p.startDate)>=d}
function plansFor(d){return plans.filter(p=>occursOnPlan(p,d))}
function planRow(p){return`<div class="row"><div class="left"><button class="check ${p.done?'done':''}" onclick="togglePlan(${p.id});event.stopPropagation()"></button><div onclick="openPlanForm(${p.id})"><strong>${esc(p.title)}</strong><div class="muted">${p.startDate}${p.endDate&&p.endDate!==p.startDate?' → '+p.endDate:''}</div></div></div>${p.focus&&!p.done?`<button class="action" onclick="openFocusForm(${p.id});event.stopPropagation()">▶ 专注</button>`:''}</div>`}
function togglePlan(id){const p=plans.find(x=>x.id===id);if(p){p.done=!p.done;saveAll();render()}}

function routineOccurs(r,date=new Date()){const dow=date.getDay();if(r.repeat==='daily')return true;if(r.repeat==='weekdays')return dow>=1&&dow<=5;if(r.repeat==='weekends')return dow===0||dow===6;if(r.repeat==='custom')return (r.days||[]).includes(dow);return true}
function renderToday(){
 const d=todayKey(),ps=plansFor(d);todayPlanCount.textContent=`${ps.filter(x=>x.done).length}/${ps.length}`;
 todayPlans.innerHTML=ps.length?ps.map(planRow).join(''):`<div class="empty">今天还没有计划。<br><button class="action" style="margin-top:8px" onclick="openPlanForm()">＋ 添加</button></div>`;
 const rs=routines.filter(r=>routineOccurs(r));todayRoutine.innerHTML=rs.length?rs.map(r=>`<div class="row" onclick="openRoutineDetail(${r.id})"><div><strong>${esc(r.title)}</strong><div class="muted">${r.time} · ${(r.steps||[]).length} 个步骤</div></div><span>›</span></div>`).join(''):`<div class="empty">今天没有 Routine。</div>`;
 const hs=habits.filter(h=>h.active&&habitDueToday(h));
 todayHabits.innerHTML=hs.length?hs.map(h=>habitTodayRow(h)).join(''):`<div class="empty">今天没有需要提醒的习惯。</div>`;
 const ms=moods.filter(m=>m.date===d&&m.daily);todayMoodText.textContent=ms.length?`${ms.at(-1).emoji} ${ms.at(-1).label}`:'还没记录';
 const reminders=[];
 const anns=anniversaries.map(a=>({a,n:nextAnniv(a)})).filter(x=>x.n&&days(new Date(),x.n)>=0&&days(new Date(),x.n)<=Number(x.a.remindDays||7)).sort((x,y)=>x.n-y.n);
 anns.forEach(({a,n})=>reminders.push(`<div class="row" onclick="openAnniv(${a.id})"><span>♡ ${esc(a.title)}</span><span class="muted">${days(new Date(),n)===0?'今天':`还有 ${days(new Date(),n)} 天`}</span></div>`));
 todayReminders.innerHTML=reminders.length?reminders.join(''):`<div class="empty">今天没有额外提醒。</div>`;
}
function periodStart(h,d=new Date()){if(h.period==='daily')return dateKey(d);if(h.period==='weekly'){const x=new Date(d);const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return dateKey(x)}if(h.period==='monthly')return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;return''}
function habitLogsInPeriod(h){if(h.type==='flex')return habitLogs.filter(l=>l.habitId===h.id);const start=periodStart(h);return habitLogs.filter(l=>l.habitId===h.id&&l.date>=start&&l.date<=todayKey())}
function lastHabitDate(h){const a=habitLogs.filter(l=>l.habitId===h.id).sort((a,b)=>a.date.localeCompare(b.date));return a.length?a.at(-1).date:null}
function habitDueToday(h){if(h.type==='flex'){const last=lastHabitDate(h);if(!last)return true;return days(parseDate(last),new Date())>=h.minGap}return habitLogsInPeriod(h).length<h.target}
function habitTodayRow(h){const logs=habitLogsInPeriod(h),doneToday=habitLogs.some(l=>l.habitId===h.id&&l.date===todayKey());let meta='';if(h.type==='flex'){const last=lastHabitDate(h);meta=last?`距上次 ${days(parseDate(last),new Date())} 天 · 理想 ${h.idealGap} 天`:'还没有记录'}else meta=`${h.period==='daily'?'每天':h.period==='weekly'?'每周':'每月'} ${h.target} 次 · 当前 ${logs.length}/${h.target}`;return`<div class="row"><div class="left"><button class="check ${doneToday?'done':''}" onclick="toggleHabitToday(${h.id})"></button><div><strong>${esc(h.title)}</strong><div class="muted">${meta}</div></div></div><button class="action" onclick="openHabitSummary(${h.id})">总结</button></div>`}
function toggleHabitToday(id){const i=habitLogs.findIndex(l=>l.habitId===id&&l.date===todayKey());if(i>=0)habitLogs.splice(i,1);else habitLogs.push({id:uid(),habitId:id,date:todayKey(),value:1});saveAll();render()}
function openMood(){
 const cur=moods.filter(m=>m.date===todayKey()&&m.daily).at(-1);const opts=[['开心','😊'],['平静','🙂'],['满足','😌'],['疲惫','😴'],['烦躁','😫'],['难过','😢'],['焦虑','😰'],['兴奋','🤩']];
 showSheet(`<div class="sheet-head"><h2>心情打卡</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div id="moodChoice" data-label="${cur?.label||''}" data-emoji="${cur?.emoji||''}" class="mood-grid">${opts.map(o=>`<button class="moodbtn ${cur?.label===o[0]?'active':''}" onclick="chooseMood(this,'${o[0]}','${o[1]}')"><b>${o[1]}</b>${o[0]}</button>`).join('')}</div><div class="field"><label>一句话（可选）</label><textarea id="moodNote">${esc(cur?.note||'')}</textarea></div><button class="primary" onclick="confirmMood()">确定保存</button><div class="note" style="margin-top:9px">保存后 Today 会立即显示你的今日代表心情。</div>`)
}
function chooseMood(btn,l,e){document.querySelectorAll('.moodbtn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');moodChoice.dataset.label=l;moodChoice.dataset.emoji=e}
function confirmMood(){const l=moodChoice.dataset.label,e=moodChoice.dataset.emoji;if(!l)return toast('先选择一个心情');moods=moods.filter(m=>!(m.date===todayKey()&&m.daily));moods.push({id:uid(),date:todayKey(),label:l,emoji:e,note:moodNote.value.trim(),daily:true});saveAll();closeSheet();render();toast('今日心情已保存')}

// PLAN
function renderPlan(){
 monthTitle.textContent=planMonth.toLocaleDateString('zh-CN',{year:'numeric',month:'long'});selectedDateTitle.textContent=selectedPlanDate;
 const y=planMonth.getFullYear(),m=planMonth.getMonth(),first=new Date(y,m,1).getDay(),cnt=new Date(y,m+1,0).getDate();let h=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let n=1;n<=cnt;n++){const k=dateKey(new Date(y,m,n)),ps=plansFor(k);const visible=ps.slice(0,3);h+=`<div class="day ${k===todayKey()?'today':''} ${k===selectedPlanDate?'selected':''}" onclick="selectPlanDate('${k}')"><div class="daynum">${n}</div>${visible.map(p=>`<span class="cal-event ${p.done?'done':''}">${p.done?'✓ ':''}${esc(p.title)}</span>`).join('')}${ps.length>3?`<div class="cal-more">+${ps.length-3}</div>`:''}</div>`}
 monthCalendar.innerHTML=h;
 const ps=plansFor(selectedPlanDate);selectedDatePlans.innerHTML=ps.length?ps.map(planRow).join(''):`<div class="empty">这天没有计划。<br><button class="action" style="margin-top:8px" onclick="openPlanForm(null,'${selectedPlanDate}')">＋ 添加计划</button></div>`;
 poolCount.textContent=planPool.length;planPool.innerHTML=(planPool.map(p=>`<button class="row" style="width:100%;border:0;background:transparent;text-align:left" onclick="openPool(${p.id})"><span>${esc(p.title)}</span><span class="muted">未安排 ›</span></button>`).join('')||'<div class="empty">Plan Pool 为空。</div>')+`<div class="row"><button class="iconbtn" style="font-size:15px" onclick="openPoolForm()">＋ 添加到 Plan Pool</button></div>`;
 annivCount.textContent=anniversaries.length;annivList.innerHTML=(anniversaries.slice().sort((a,b)=>nextAnniv(a)-nextAnniv(b)).map(a=>`<div class="row" onclick="openAnniv(${a.id})"><div><strong>${esc(a.title)}</strong><div class="muted">${a.date} · ${a.repeat==='yearly'?'每年':a.repeat==='monthly'?'每月':'不重复'}</div></div><span class="pill">${annivLabel(a)}</span></div>`).join('')||'<div class="empty">还没有纪念日。</div>')+`<div class="row"><button class="iconbtn" style="font-size:15px" onclick="openAnnivForm()">＋ 添加纪念日</button></div>`;
}
function changeMonth(n){planMonth=new Date(planMonth.getFullYear(),planMonth.getMonth()+n,1);renderPlan()}
function selectPlanDate(k){selectedPlanDate=k;const d=parseDate(k);planMonth=new Date(d.getFullYear(),d.getMonth(),1);renderPlan()}
function openPlanForm(id=null,forcedDate=null){const p=id?plans.find(x=>x.id===id):null,sd=forcedDate||p?.startDate||selectedPlanDate||todayKey();showSheet(`<div class="sheet-head"><h2>${p?'编辑计划':'新建计划'}</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>计划</label><input id="pfTitle" value="${esc(p?.title||'')}" placeholder="做什么？"></div><div class="two"><div class="field"><label>开始日期</label><input id="pfStart" type="date" value="${sd}"></div><div class="field"><label>结束日期</label><input id="pfEnd" type="date" value="${p?.endDate||sd}"></div></div><div class="field"><label><input id="pfFocus" type="checkbox" ${p?.focus!==false?'checked':''}> 可以直接专注</label></div><button class="primary" onclick="savePlanForm(${id||'null'})">保存</button>${p?`<div style="height:9px"></div><button class="danger" onclick="deletePlan(${p.id})">删除计划</button>`:''}`)}
function savePlanForm(id){const t=pfTitle.value.trim(),s=pfStart.value,e=pfEnd.value||s;if(!t||!s)return toast('请填写计划和日期');if(e<s)return toast('结束日期不能早于开始日期');if(id){const p=plans.find(x=>x.id===id);Object.assign(p,{title:t,startDate:s,endDate:e,focus:pfFocus.checked})}else plans.push({id:uid(),title:t,startDate:s,endDate:e,focus:pfFocus.checked,done:false});saveAll();closeSheet();selectedPlanDate=s;render();toast('计划已保存')}
function deletePlan(id){plans=plans.filter(x=>x.id!==id);saveAll();closeSheet();render();toast('计划已删除')}
function openPoolForm(){showSheet(`<div class="sheet-head"><h2>Plan Pool</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>以后想做什么？</label><input id="poolTitle"></div><button class="primary" onclick="savePool()">保存</button>`)}
function savePool(){const t=poolTitle.value.trim();if(!t)return;planPool.push({id:uid(),title:t});saveAll();closeSheet();render()}
function openPool(id){const p=planPool.find(x=>x.id===id);if(!p)return toast('这条计划已不存在');showSheet(`<div class="sheet-head"><h2>Plan Pool</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>计划</label><input id="poolEditTitle" value="${esc(p.title)}"></div><div class="field"><label>安排日期</label><input id="poolDate" type="date" value="${todayKey()}"></div><button class="primary" onclick="schedulePool(${id})">安排到日期</button><div style="height:9px"></div><button class="secondary" onclick="savePoolEdit(${id})">只保存修改</button><div style="height:9px"></div><button class="danger" onclick="deletePool(${id})">删除</button>`)}
function savePoolEdit(id){const p=planPool.find(x=>x.id===id);if(!p)return;const t=poolEditTitle.value.trim();if(!t)return toast('计划不能为空');p.title=t;saveAll();closeSheet();render();toast('Plan Pool 已更新')}
function schedulePool(id){const p=planPool.find(x=>x.id===id),d=poolDate.value;if(!p||!d)return;const title=(document.getElementById('poolEditTitle')?.value||p.title).trim();plans.push({id:uid(),title:title,startDate:d,endDate:d,focus:true,done:false});planPool=planPool.filter(x=>x.id!==id);saveAll();closeSheet();selectedPlanDate=d;render()}

// ROUTINE
function openRoutine(){normalize();saveAll();showSheet(`<div class="sheet-head"><h2>Routine</h2><button class="iconbtn" onclick="closeSheet()">×</button></div>${routines.map(r=>`<div class="card" style="margin-bottom:10px"><div class="row"><button class="left" style="border:0;background:transparent;text-align:left;flex:1" onclick="openRoutineDetail(${r.id})"><div><strong>${esc(r.title)}</strong><div class="muted">${esc(r.time||'')} · ${repeatLabel(r)}</div></div></button><button class="action" onclick="openRoutineForm(${r.id})">编辑</button><button class="action" onclick="deleteRoutine(${r.id})">删除</button></div></div>`).join('')||'<div class="empty">还没有 Routine。</div>'}<button class="secondary" onclick="openRoutineForm()">＋ 新建 Routine</button>`)}
function repeatLabel(r){if(r.repeat==='daily')return'每天';if(r.repeat==='weekdays')return'工作日';if(r.repeat==='weekends')return'周末';if(r.repeat==='custom')return(r.days||[]).map(d=>'日一二三四五六'[d]).join('、');return''}
function openRoutineForm(id=null){const r=id?routines.find(x=>x.id===id):null;showSheet(`<div class="sheet-head"><h2>${r?'编辑':'新建'} Routine</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>名称</label><input id="rfTitle" value="${esc(r?.title||'')}"></div><div class="field"><label>时间</label><input id="rfTime" type="time" value="${r?.time||'07:00'}"></div><div class="field"><label>重复</label><select id="rfRepeat" onchange="rfDaysBox.classList.toggle('hidden',this.value!=='custom')"><option value="daily" ${r?.repeat==='daily'?'selected':''}>每天</option><option value="weekdays" ${r?.repeat==='weekdays'?'selected':''}>工作日</option><option value="weekends" ${r?.repeat==='weekends'?'selected':''}>周末</option><option value="custom" ${r?.repeat==='custom'?'selected':''}>自定义星期</option></select></div><div id="rfDaysBox" class="field ${r?.repeat==='custom'?'':'hidden'}"><label>星期（可多选）</label><div class="three">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="rfday" value="${d}" ${(r?.days||[]).includes(d)?'checked':''}> 周${'日一二三四五六'[d]}</label>`).join('')}</div></div><div class="field"><label>步骤（每行一个，可增删）</label><textarea id="rfSteps" placeholder="起床&#10;洗漱&#10;早餐">${esc((r?.steps||[]).map(s=>s.title).join('\n'))}</textarea></div><button class="primary" onclick="saveRoutineForm(${id||'null'})">保存</button>${r?`<div style="height:9px"></div><button class="danger" onclick="deleteRoutine(${id})">删除 Routine</button>`:''}`)}
function saveRoutineForm(id){const title=rfTitle.value.trim(),time=rfTime.value,repeat=rfRepeat.value,ds=[...document.querySelectorAll('input[name=rfday]:checked')].map(x=>Number(x.value)),ss=rfSteps.value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({id:uid(),title:x}));if(!title)return toast('请填写名称');const o={title,time,repeat,days:ds,steps:ss};if(id)Object.assign(routines.find(x=>x.id===id),o);else routines.push({id:uid(),...o});saveAll();openRoutine();render()}

// HABIT
function openHabits(){normalize();saveAll();showSheet(`<div class="sheet-head"><h2>Habit</h2><button class="iconbtn" onclick="closeSheet()">×</button></div>${habits.map(h=>`<div class="card" style="margin-bottom:10px"><div class="row"><button class="left" style="border:0;background:transparent;text-align:left;flex:1" onclick="openHabitSummary(${h.id})"><div><strong>${esc(h.title)}</strong><div class="muted">${habitRule(h)}</div></div></button><button class="action" onclick="openHabitForm(${h.id})">编辑</button><button class="action" onclick="deleteHabit(${h.id})">删除</button></div></div>`).join('')||'<div class="empty">还没有 Habit。</div>'}<button class="secondary" onclick="openHabitForm()">＋ 新建 Habit</button>`)}
function habitRule(h){if(h.type==='flex')return`弹性 · ${h.minGap}/${h.idealGap}/${h.maxGap} 天`;return`${h.type==='fixed'?'固定':'次数'} · ${h.period==='daily'?'每天':h.period==='weekly'?'每周':'每月'} ${h.target} 次`}
function openHabitForm(id=null){const h=id?habits.find(x=>x.id===id):null;showSheet(`<div class="sheet-head"><h2>${h?'编辑':'新建'} Habit</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>名称</label><input id="hfTitle" value="${esc(h?.title||'')}"></div><div class="field"><label>打卡类型</label><select id="hfType" onchange="habitFormType()"><option value="fixed" ${h?.type==='fixed'?'selected':''}>固定型</option><option value="count" ${h?.type==='count'?'selected':''}>次数型</option><option value="flex" ${h?.type==='flex'?'selected':''}>弹性周期型</option></select></div><div id="normalHabitFields" class="${h?.type==='flex'?'hidden':''}"><div class="field"><label>周期</label><select id="hfPeriod"><option value="daily" ${h?.period==='daily'?'selected':''}>每天</option><option value="weekly" ${h?.period==='weekly'?'selected':''}>每周</option><option value="monthly" ${h?.period==='monthly'?'selected':''}>每月</option></select></div><div class="field"><label>周期内打卡次数</label><input id="hfTarget" type="number" min="1" value="${h?.target||1}"></div></div><div id="flexHabitFields" class="${h?.type==='flex'?'':'hidden'}"><div class="three"><div class="field"><label>最早</label><input id="hfMin" type="number" min="1" value="${h?.minGap||2}"></div><div class="field"><label>理想</label><input id="hfIdeal" type="number" min="1" value="${h?.idealGap||3}"></div><div class="field"><label>最晚</label><input id="hfMax" type="number" min="1" value="${h?.maxGap||4}"></div></div></div><button class="primary" onclick="saveHabitForm(${id||'null'})">保存</button>${h?`<div style="height:9px"></div><button class="danger" onclick="deleteHabit(${id})">删除 Habit</button>`:''}`)}
function habitFormType(){normalHabitFields.classList.toggle('hidden',hfType.value==='flex');flexHabitFields.classList.toggle('hidden',hfType.value!=='flex')}
function saveHabitForm(id){const title=hfTitle.value.trim(),type=hfType.value;if(!title)return;const o={title,type,active:true,period:type==='flex'?'flex':hfPeriod.value,target:type==='flex'?1:Number(hfTarget.value||1),minGap:type==='flex'?Number(hfMin.value||2):2,idealGap:type==='flex'?Number(hfIdeal.value||3):3,maxGap:type==='flex'?Number(hfMax.value||4):4};if(id)Object.assign(habits.find(x=>x.id===id),o);else habits.push({id:uid(),...o});saveAll();openHabits();render()}
function deleteHabit(id){habits=habits.filter(x=>x.id!==id);habitLogs=habitLogs.filter(x=>x.habitId!==id);saveAll();openHabits();render()}
function habitHeatmap(id){const set=new Set(habitLogs.filter(x=>x.habitId===id).map(x=>x.date)),cells=[];for(let i=83;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=dateKey(d),on=set.has(k);cells.push(`<span title="${k}" style="width:14px;height:14px;border-radius:3px;display:block;background:${on?'#78966f':'#eeeae4'}"></span>`)}return `<div style="display:grid;grid-template-columns:repeat(12,14px);grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow:auto;padding:4px 0">${cells.join('')}</div><div class="muted" style="margin-top:8px">深色 = 已打卡</div>`}

function nextAnniv(a){const raw=parseDate(a.date),now=new Date();if(a.repeat==='none')return raw;if(a.repeat==='monthly'){let n=new Date(now.getFullYear(),now.getMonth(),raw.getDate());if(n<dayStart(now))n=new Date(now.getFullYear(),now.getMonth()+1,raw.getDate());return n}let n=new Date(now.getFullYear(),raw.getMonth(),raw.getDate());if(n<dayStart(now))n=new Date(now.getFullYear()+1,raw.getMonth(),raw.getDate());return n}
function annivLabel(a){if(a.mode==='elapsed')return`已 ${Math.max(0,days(parseDate(a.date),new Date()))} 天`;const d=days(new Date(),nextAnniv(a));return d===0?'今天':`还有 ${d} 天`}

async function renderPhotoCalendar(box){
 const y=photoMonth.getFullYear(),m=photoMonth.getMonth(),ym=`${y}-${String(m+1).padStart(2,'0')}`,first=new Date(y,m,1).getDay(),cnt=new Date(y,m+1,0).getDate();

 for(let i=0;i<first;i++)h+='<div></div>';
 for(let n=1;n<=cnt;n++){const k=`${ym}-${String(n).padStart(2,'0')}`,ids=by[k]||[];let u=ids[0]?await photoURL(ids[0]):'';h+=`<button class="photo-day ${u?'':'photo-empty'}" onclick="openPhotoDay('${k}')"><span class="n">${n}</span>${u?`<img src="${u}">${ids.length>1?`<span class="count">+${ids.length-1}</span>`:''}`:'·'}</button>`}
 h+='</div></div>';box.innerHTML=h;
}

function openHealth(){const w=health.weight.at(-1),month=todayKey().slice(0,7);showSheet(`<div class="sheet-head"><h2>Health</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="stats"><div class="stat"><span class="muted">体重</span><strong>${w?w.value:'—'}</strong><span class="muted">kg</span></div><div class="stat"><span class="muted">运动</span><strong>${health.exercise.filter(x=>x.date.startsWith(month)).length}</strong><span class="muted">本月次</span></div><div class="stat"><span class="muted">睡眠</span><strong>${health.sleep.at(-1)?.hours||'—'}</strong><span class="muted">小时</span></div><div class="stat"><span class="muted">生理期</span><strong>${periodStatus()}</strong><span class="muted">当前状态</span></div></div><div class="section"><div class="section-title"><span>健康趋势</span><span>最近记录</span></div><div class="card">${healthTrends()}</div></div><div class="quick-grid"><button class="qitem" onclick="openWeightForm()"><span>⚖️</span>体重</button><button class="qitem" onclick="openPeriodForm()"><span>🌸</span>生理期</button><button class="qitem" onclick="openExerciseForm()"><span>🏃</span>运动</button><button class="qitem" onclick="openSleepForm()"><span>🌙</span>睡眠</button><button class="qitem" onclick="openStepsForm()"><span>👟</span>步数</button></div>`)}
function miniTrend(arr,key,label,unit){const a=(arr||[]).slice(-7);if(!a.length)return `<div class="muted" style="padding:7px 0">${label}：暂无数据</div>`;const vals=a.map(x=>Number(x[key]||0)),max=Math.max(...vals,1);return `<div style="margin:10px 0"><div class="row" style="padding:0 0 6px"><strong>${label}</strong><span class="muted">${vals.at(-1)} ${unit}</span></div><div style="height:72px;display:flex;align-items:flex-end;gap:5px">${vals.map(v=>`<span style="flex:1;min-width:8px;height:${Math.max(5,v/max*68)}px;background:#8c9b80;border-radius:5px 5px 2px 2px"></span>`).join('')}</div></div>`}
function healthTrends(){return miniTrend(health.weight,'value','体重','kg')+miniTrend(health.sleep,'hours','睡眠','h')+miniTrend(health.steps,'steps','步数','步')+miniTrend(health.exercise,'minutes','运动','min')}
function weightChart(){const a=health.weight.slice(-8);if(!a.length)return'<div class="empty">记录体重后这里会出现趋势。</div>';const vals=a.map(x=>Number(x.value)),min=Math.min(...vals),max=Math.max(...vals);return`<div class="bar-chart">${a.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${20+(Number(x.value)-min)/(max-min||1)*75}px"></div>${x.date.slice(5)}</div>`).join('')}</div>`}

function saveWeight(){const v=Number(wfValue.value);if(!v)return;health.weight.push({id:uid(),value:v,date:wfDate.value});saveAll();closeSheet();render();toast('体重已记录')}
function periodStatus(){const p=health.periods.at(-1);if(!p)return'未记录';if(p.start&&!p.end)return'经期中';return p.end?`上次 ${p.end.slice(5)}`:'未记录'}
function openPeriodForm(){showSheet(`<div class="sheet-head"><h2>生理期</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="two"><div class="field"><label>开始日期</label><input id="perStart" type="date" value="${todayKey()}"></div><div class="field"><label>结束日期（可后补）</label><input id="perEnd" type="date"></div></div><div class="field"><label>备注</label><input id="perNote" placeholder="疼痛、状态等（可选）"></div><button class="primary" onclick="savePeriod()">保存</button><div class="section"><div class="section-title"><span>历史</span><span></span></div><div class="card">${health.periods.slice().reverse().slice(0,8).map(p=>`<div class="row"><span>${p.start} → ${p.end||'进行中'}</span><span class="muted">${esc(p.note||'')}</span></div>`).join('')||'<div class="empty">还没有记录。</div>'}</div></div>`)}
function savePeriod(){health.periods.push({id:uid(),start:perStart.value,end:perEnd.value,note:perNote.value.trim()});saveAll();closeSheet();render()}
function openExerciseForm(){showSheet(`<div class="sheet-head"><h2>记录运动</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>类型</label><input id="exType" placeholder="走路 / 跑步 / 跳操"></div><div class="two"><div class="field"><label>分钟</label><input id="exMin" type="number"></div><div class="field"><label>日期</label><input id="exDate" type="date" value="${todayKey()}"></div></div><button class="primary" onclick="saveExercise()">保存</button>`)}
function saveExercise(){health.exercise.push({id:uid(),type:exType.value.trim()||'运动',minutes:Number(exMin.value||0),date:exDate.value});saveAll();closeSheet();render();toast('运动已记录')}
function openSleepForm(){showSheet(`<div class="sheet-head"><h2>记录睡眠</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="two"><div class="field"><label>睡眠时长（小时）</label><input id="slHours" type="number" step=".1"></div><div class="field"><label>日期</label><input id="slDate" type="date" value="${todayKey()}"></div></div><div class="field"><label>质量</label><select id="slQuality"><option>很好</option><option>一般</option><option>较差</option></select></div><button class="primary" onclick="saveSleep()">保存</button>`)}
function saveSleep(){health.sleep.push({id:uid(),hours:Number(slHours.value||0),quality:slQuality.value,date:slDate.value});saveAll();closeSheet();render();toast('睡眠已记录')}
function openStepsForm(){showSheet(`<div class="sheet-head"><h2>记录步数</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>步数</label><input id="stValue" type="number"></div><div class="field"><label>日期</label><input id="stDate" type="date" value="${todayKey()}"></div><button class="primary" onclick="saveSteps()">保存</button>`)}
function saveSteps(){health.steps.push({id:uid(),value:Number(stValue.value||0),date:stDate.value});saveAll();closeSheet();render()}

// KNOWLEDGE
function openKnowledge(){showSheet(`<div class="sheet-head"><h2>Knowledge</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><input id="knSearch" placeholder="搜索笔记" oninput="renderKnowledge(this.value)"></div><div id="knowledgeList"></div><button class="secondary" onclick="openKnowledgeForm()">＋ 新建笔记</button>`);renderKnowledge('')}
function renderKnowledge(q=''){const box=document.getElementById('knowledgeList');if(!box)return;const a=knowledge.filter(n=>(n.title+n.content+(n.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase()));box.innerHTML=a.map(n=>`<div class="card" style="margin-bottom:9px" onclick="openKnowledgeForm(${n.id})"><strong>${esc(n.title)}</strong><div class="muted" style="margin-top:5px">${esc((n.content||'').slice(0,60))}</div><div>${(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">还没有笔记。</div>'}
function openKnowledgeForm(id=null){const n=id?knowledge.find(x=>x.id===id):null;showSheet(`<div class="sheet-head"><h2>${n?'编辑':'新建'}笔记</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><label>标题</label><input id="kfTitle" value="${esc(n?.title||'')}"></div><div class="field"><label>内容</label><textarea id="kfContent">${esc(n?.content||'')}</textarea></div><div class="field"><label>标签</label><input id="kfTags" value="${esc((n?.tags||[]).join(','))}"></div><div class="field"><label>照片（可多选）</label><input id="kfPhotos" type="file" accept="image/*" multiple></div><div id="kfExistingPhotos"></div><button class="primary" onclick="saveKnowledge(${id||'null'})">保存</button>${n?`<div style="height:9px"></div><button class="danger" onclick="deleteKnowledge(${id})">删除</button>`:''}`); if(n?.photoIds?.length) photoHtml(n.photoIds).then(h=>{const el=document.getElementById('kfExistingPhotos');if(el)el.innerHTML=h})}
async function saveKnowledge(id){const newIds=await saveFiles('kfPhotos'),o={title:kfTitle.value.trim(),content:kfContent.value.trim(),tags:kfTags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)};if(!o.title)return;if(id){const n=knowledge.find(x=>x.id===id);Object.assign(n,o);n.photoIds=[...(n.photoIds||[]),...newIds]}else knowledge.push({id:uid(),photoIds:newIds,...o});saveAll();openKnowledge()}
function deleteKnowledge(id){knowledge=knowledge.filter(x=>x.id!==id);saveAll();openKnowledge()}

// FOCUS
function openFocusForm(planId=null){const p=planId?plans.find(x=>x.id===planId):null;showSheet(`<div class="sheet-head"><h2>开始专注</h2><button class="iconbtn" onclick="closeSheet()">×</button></div>${p?`<div class="card" style="margin-bottom:12px"><strong>${esc(p.title)}</strong><div class="muted">关联 Plan</div></div>`:''}<div class="quick-grid"><button class="qitem" onclick="startFocus('pomodoro',25,${planId||'null'})"><span>🍅</span>番茄 25</button><button class="qitem" onclick="startFocus('countdown',45,${planId||'null'})"><span>⏳</span>倒计时 45</button><button class="qitem" onclick="startFocus('countup',0,${planId||'null'})"><span>⏱</span>正计时</button></div>`)}
function startFocus(mode,min,planId){focusState={mode,target:min*60,planId,start:Date.now(),paused:false,pausedTotal:0};S.set('focusState',focusState);closeSheet();resumeFocus();toast('专注已开始')}
function resumeFocus(){clearInterval(focusTimer);if(!focusState)return;focusFloat.classList.add('show');tickFocus();focusTimer=setInterval(tickFocus,1000)}
function focusSeconds(){return Math.floor((Date.now()-focusState.start-(focusState.pausedTotal||0))/1000)}
function tickFocus(){if(!focusState)return;const s=focusSeconds();let show=s;if(focusState.mode!=='countup'){show=Math.max(0,focusState.target-s);if(show<=0)return finishFocus()}focusFloatTime.textContent=`${String(Math.floor(show/60)).padStart(2,'0')}:${String(show%60).padStart(2,'0')}`}
function openRunningFocus(){if(!focusState)return;showSheet(`<div class="sheet-head"><h2>专注中</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div style="font-size:45px;text-align:center;margin:28px 0">${focusFloatTime.textContent}</div><button class="primary" onclick="finishFocus()">结束并保存</button><div style="height:9px"></div><button class="danger" onclick="cancelFocus()">放弃本次</button>`)}
function finishFocus(){if(!focusState)return;const min=Math.max(1,Math.round(focusSeconds()/60));focusRecords.push({id:uid(),minutes:min,date:todayKey(),planId:focusState.planId,mode:focusState.mode});focusState=null;S.set('focusState',null);saveAll();clearInterval(focusTimer);focusFloat.classList.remove('show');closeSheet();render();toast(`已保存 ${min} 分钟`)}
function cancelFocus(){focusState=null;S.set('focusState',null);clearInterval(focusTimer);focusFloat.classList.remove('show');closeSheet()}

// MY SPACE
function openMySpace(){showSheet(`<div class="sheet-head"><h2>My Space</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><button class="row" style="width:100%;border:0;background:transparent" onclick="openHabits()"><span>🌱 Habit</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openRoutine()"><span>🔄 Routine</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openMoney()"><span>💰 Money</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openHealth()"><span>❤️ Health</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openKnowledge()"><span>📚 Knowledge</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="lifeMode='drinks';closeSheet();switchView('life')"><span>🧋 Drinks</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openSearch()"><span>🔍 Search</span><span>›</span></button><button class="row" style="width:100%;border:0;background:transparent" onclick="openBackup()"><span>⚙️ Settings & Backup</span><span>›</span></button>`)}
function openSearch(){showSheet(`<div class="sheet-head"><h2>Search</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="field"><input id="searchQ" placeholder="搜索 Life / Plan / Knowledge / 饮品" oninput="runSearch(this.value)"></div><div id="searchResult" class="card"><div class="empty">输入关键词开始。</div></div>`)}
function runSearch(q){q=q.trim().toLowerCase();if(!q)return searchResult.innerHTML='<div class="empty">输入关键词开始。</div>';const a=[];plans.filter(x=>x.title.toLowerCase().includes(q)).forEach(x=>a.push(`Plan · ${x.title}`));life.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>a.push(`Life · ${x.type==='drink'?(x.brand+' '+x.drinkName):(x.text||'照片记录')}`));knowledge.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>a.push(`Knowledge · ${x.title}`));searchResult.innerHTML=a.map(x=>`<div class="row"><span>${esc(x)}</span></div>`).join('')||'<div class="empty">没有找到。</div>'}
function openBackup(){showSheet(`<div class="sheet-head"><h2>Settings & Backup</h2><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="row"><span>版本</span><strong>v0.8</strong></div><div class="row"><span>数据模式</span><span class="muted">Local First</span></div><div class="note" style="margin:12px 0">结构化数据保存在本机 localStorage；照片保存在 IndexedDB。清除 Safari 网站数据会导致数据丢失。</div><button class="primary" onclick="exportBackup()">导出结构化备份</button><div style="height:9px"></div><div class="field"><label>导入 JSON 备份</label><input type="file" accept="application/json" onchange="importBackup(event)"></div>`)}
function exportBackup(){const data={plans,planPool,routines,habits,habitLogs,moods,life,money,moneyCategories,budgets,health,anniversaries,knowledge,focusRecords,monthNotes};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-life-os-v0.8-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);plans=d.plans||plans;planPool=d.planPool||planPool;routines=d.routines||routines;habits=d.habits||habits;habitLogs=d.habitLogs||habitLogs;moods=d.moods||moods;life=d.life||life;money=d.money||money;moneyCategories=d.moneyCategories||moneyCategories;budgets=d.budgets||budgets;health=d.health||health;anniversaries=d.anniversaries||anniversaries;knowledge=d.knowledge||knowledge;focusRecords=d.focusRecords||focusRecords;monthNotes=d.monthNotes||monthNotes;saveAll();S.set('monthNotes',monthNotes);closeSheet();render();toast('备份已导入')}catch(err){toast('备份文件无效')}};r.readAsText(f)}

// ARCHIVE
async function renderArchive(){archiveTitle.textContent=archiveDate.toLocaleDateString('zh-CN',{year:'numeric',month:'long'});const ym=`${archiveDate.getFullYear()}-${String(archiveDate.getMonth()+1).padStart(2,'0')}`,ls=life.filter(x=>(x.date||'').startsWith(ym)),ms=money.filter(x=>(x.date||'').startsWith(ym)&&x.type!=='income'),fs=focusRecords.filter(x=>(x.date||'').startsWith(ym)),hl=habitLogs.filter(x=>x.date.startsWith(ym));archiveStats.innerHTML=`<div class="stat"><span class="muted">Life</span><strong>${ls.length}</strong><span class="muted">条记录</span></div><div class="stat"><span class="muted">Money</span><strong>¥${ms.reduce((a,b)=>a+Number(b.amount||0),0).toFixed(0)}</strong><span class="muted">支出</span></div><div class="stat"><span class="muted">Focus</span><strong>${fs.reduce((a,b)=>a+Number(b.minutes||0),0)}m</strong><span class="muted">专注</span></div><div class="stat"><span class="muted">Habit</span><strong>${hl.length}</strong><span class="muted">次打卡</span></div>`;
 const ids=ls.flatMap(x=>x.photoIds||[]);archivePhotoCount.textContent=ids.length;let by={};ls.forEach(x=>(x.photoIds||[]).forEach(id=>(by[x.date]??=[]).push(id)));let pc='<div class="photo-calendar">'+['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');const ay=archiveDate.getFullYear(),am=archiveDate.getMonth(),af=new Date(ay,am,1).getDay(),ac=new Date(ay,am+1,0).getDate();for(let i=0;i<af;i++)pc+='<div></div>';for(let n=1;n<=ac;n++){const k=`${ym}-${String(n).padStart(2,'0')}`,a=by[k]||[],u=a[0]?await photoURL(a[0]):'';pc+=`<button class="photo-day ${u?'':'photo-empty'}" onclick="openPhotoDay('${k}')"><span class="n">${n}</span>${u?`<img src="${u}">${a.length>1?`<span class="count">+${a.length-1}</span>`:''}`:'·'}</button>`}archivePhotos.innerHTML=pc+'</div>';
 let ach=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<af;i++)ach+='<div></div>';for(let n=1;n<=ac;n++){const k=`${ym}-${String(n).padStart(2,'0')}`,ps=plans.filter(x=>x.date===k),lc=life.filter(x=>x.date===k).length,mo=moods.find(x=>x.date===k&&x.daily);ach+=`<div class="day"><div class="daynum">${n}${mo?` ${mo.emoji}`:''}</div>${ps.slice(0,2).map(p=>`<span class="cal-event ${p.done?'done':''}">${esc(p.title)}</span>`).join('')}${lc?`<span class="cal-event">Life × ${lc}</span>`:''}</div>`}archiveCalendar.innerHTML=ach;
 const md=moods.filter(x=>x.date.startsWith(ym)&&x.daily),counts={};md.forEach(x=>counts[x.emoji]=(counts[x.emoji]||0)+1);archiveMoods.innerHTML=Object.keys(counts).length?Object.entries(counts).map(([e,n])=>`<span class="tag" style="font-size:17px">${e} × ${n}</span>`).join(''):'<div class="empty">这个月还没有心情记录。</div>';monthNote.value=monthNotes[ym]||'';
}
function archiveMonth(n){archiveDate=new Date(archiveDate.getFullYear(),archiveDate.getMonth()+n,1);renderArchive()}
function saveMonthNote(){const ym=`${archiveDate.getFullYear()}-${String(archiveDate.getMonth()+1).padStart(2,'0')}`;monthNotes[ym]=monthNote.value;S.set('monthNotes',monthNotes)}

// init
render();
</script>
