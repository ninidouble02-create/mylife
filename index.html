}.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px;color:var(--muted)}.tabs button.on{background:white;color:var(--ink);font-weight:700}.check{width:23px;height:23px;border:1.5px solid #b8b1a7;background:white;border-radius:50%}.check.done{background:var(--accent);border-color:var(--accent)}.check.done:after{content:'✓';color:white}.pill{background:var(--soft);border-radius:999px;padding:6px 9px;font-size:12px}.toast{position:fixed;z-index:80;bottom:115px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:999px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.spacegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.space{border:1px solid var(--line);background:white;border-radius:17px;padding:18px 12px;text-align:left}.space b{display:block;margin-top:8px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:13px}.stat strong{font-size:24px;display:block}

<div id="heartbeat">v1.4 · Today + Memo + Life Mood</div><main id="app"></main><nav id="nav" class="nav"><button data-page="today">⌂<b>Today</b></button><button data-page="plan">▣<b>Plan</b></button><button id="quickBtn" class="plus">＋</button><button data-page="life">○<b>Life</b></button><button data-page="archive">▤<b>Archive</b></button></nav><div id="overlay" class="overlay hidden"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>(()=>{'use strict';
const BUILD='v1.4 Today + Memo + Life Mood · 2026-08-19';
window.__MYLIFE_BUILD__=BUILD;
const KEY='mylife-v1-data'; const $=s=>document.querySelector(s); const app=$('#app'),overlay=$('#overlay'),sheet=$('#sheet');
const today=()=>new Date().toISOString().slice(0,10), id=()=>Date.now()+Math.floor(Math.random()*1000), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let data={plans:[],pool:[],life:[],moods:[],anniv:[],habits:[],habitRecords:[],routines:[],routineRecords:[],memos:[]};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')data={...data,...x}}catch(e){};
if(!Array.isArray(data.habitRecords))data.habitRecords=[]; if(!Array.isArray(data.routineRecords))data.routineRecords=[];
let page='today', month=new Date(new Date().getFullYear(),new Date().getMonth(),1), selected=today(), archiveMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function save(){localStorage.setItem(KEY,JSON.stringify(data))} function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
function open(html){sheet.innerHTML=html;overlay.classList.remove('hidden')} function close(){overlay.classList.add('hidden');sheet.innerHTML=''} overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
function header(title,sub,back=false,plus=''){return `<div class="top"><button class="icon" data-act="${back?'today':'space'}">${back?'‹':'☰'}</button><button class="icon" ${plus?`data-act="${plus}"`:''}>${plus?'＋':'⋯'}</button></div><h1 class="title">${title}</h1><div class="sub">${sub}</div>`}
function rows(items,empty,fn){return items.length?items.map(fn).join(''):`<div class="empty">${empty}</div>`}
function fmtCycle(h){if(h.type==='fixed')return `固定 · ${h.days?.length?h.days.map(x=>'周'+'日一二三四五六'[x]).join(' '):'每天'}`;if(h.type==='count')return `${h.period==='month'?'每月':'每周'} ${h.target||1} 次`;return `弹性 · ${h.ideal||3} 天一次`}
function recs(hid){return data.habitRecords.filter(r=>r.habitId==hid)} function doneOn(hid,d=today()){return recs(hid).some(r=>r.date===d)}
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x} function iso(d){return d.toISOString().slice(0,10)}
function habitStatus(h){if(doneOn(h.id))return '今天已完成';const rs=recs(h.id).sort((a,b)=>b.date.localeCompare(a.date));if(h.type==='count'){let n=0;if(h.period==='month'){const ym=today().slice(0,7);n=rs.filter(r=>r.date.startsWith(ym)).length}else{const s=iso(weekStart());n=rs.filter(r=>r.date>=s).length}return `${h.period==='month'?'本月':'本周'} ${n}/${h.target||1}`}
if(h.type==='flex'){if(!rs.length)return '可以做';const gap=Math.floor((new Date(today())-new Date(rs[0].date))/86400000),early=Number(h.early||2),ideal=Number(h.ideal||3),late=Number(h.late||5);if(gap<early)return '刚完成';if(gap<ideal)return '可以做';if(gap<=late)return '建议今天';return `距上次 ${gap} 天`}
return '未完成'}
function routineDue(r){if(r.archived)return false;if(!r.days?.length)return true;return r.days.includes(new Date().getDay())}
function habitDue(h){if(h.paused)return false;if(h.type==='fixed'){if(!h.days?.length)return true;return h.days.includes(new Date().getDay())}return true}
function toggleHabit(hid){const i=data.habitRecords.findIndex(r=>r.habitId==hid&&r.date===today());if(i>=0){data.habitRecords.splice(i,1);toast('已撤销打卡')}else{data.habitRecords.push({id:id(),habitId:Number(hid),date:today(),time:new Date().toTimeString().slice(0,5)});toast('打卡成功')}save();render()}
function routineRec(rid){let r=data.routineRecords.find(x=>x.routineId==rid&&x.date===today());if(!r){r={id:id(),routineId:Number(rid),date:today(),doneSteps:[]};data.routineRecords.push(r)}return r}
function render(){document.querySelectorAll('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='today')renderToday();else if(page==='plan')renderPlan();else if(page==='life')renderLife();else renderArchive()}
function renderToday(){const ps=data.plans.filter(p=>p.start<=today()&&p.end>=today()), hs=data.habits.filter(h=>!h.archived), doneN=hs.filter(h=>doneOn(h.id)).length, memos=[...data.memos].filter(m=>!m.done).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));app.innerHTML=`<section class="page">${header('Today',new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}))}<div class="section"><div class="label"><span>MY DAY</span><span>今天</span></div><div class="card">${rows(data.routines.filter(r=>routineDue(r)),'今天还没有 Routine。',r=>{const rr=data.routineRecords.find(x=>x.routineId==r.id&&x.date===today()),n=rr?.doneSteps?.length||0,total=r.steps?.length||0;return `<div class="row"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.time||'未设时间')} · ${n}/${total}</div></div><button class="btn" data-openroutine="${r.id}">${n?'继续':'开始'}</button></div>`})}</div></div><div class="section"><div class="label"><span>今日计划</span><span>${ps.length}</span></div><div class="card">${rows(ps,'今天还没有计划。',p=>planRow(p))}</div></div><div class="section"><div class="label"><span>HABIT</span><span>${doneN} / ${hs.length} 已完成</span></div><div class="habitprogress"><i style="width:${hs.length?Math.round(doneN/hs.length*100):0}%"></i></div><div class="card">${rows(hs,'还没有建立习惯。',h=>`<div class="row"><div><b>${esc(h.title)}</b><div class="muted">${fmtCycle(h)} · ${habitStatus(h)}</div></div><button class="check ${doneOn(h.id)?'done':''}" data-checkhabit="${h.id}"></button></div>`)}</div></div><div class="section"><div class="label"><span>MEMO</span><button class="btn" data-act="addmemo">＋ 备忘</button></div><div class="card">${rows(memos,'没有未完成的备忘。',m=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><button class="check" data-donememo="${m.id}"></button><div><b>${m.pinned?'⌖ ':''}${esc(m.text)}</b>${m.date?`<div class="muted">${m.date}</div>`:''}</div></div><button class="btn" data-editmemo="${m.id}">编辑</button></div>`)}</div><button class="memoarchive" data-act="memolist">查看全部备忘</button></div></section>`}
function planRow(p){return `<div class="row"><div style="display:flex;gap:10px;align-items:center"><button class="check ${p.done?'done':''}" data-toggle="${p.id}"></button><div><b>${esc(p.title)}</b><div class="muted">${p.start}${p.end!==p.start?' → '+p.end:''}</div></div></div><button class="btn" data-editplan="${p.id}">编辑</button></div>`}
function renderPlan(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let c=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)c+='<div></div>';for(let n=1;n<=days;n++){const d=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ps=data.plans.filter(p=>p.start<=d&&p.end>=d);c+=`<button class="day ${d===selected?'sel':''} ${d===today()?'today':''}" data-date="${d}"><span class="num">${n}</span>${ps.slice(0,3).map(p=>`<span class="event">${esc(p.title)}</span>`).join('')}${ps.length>3?`<span class="muted">+${ps.length-3}</span>`:''}</button>`}const chosen=data.plans.filter(p=>p.start<=selected&&p.end>=selected);app.innerHTML=`<section class="page">${header('Plan','月视图 · 计划 · Plan Pool · 纪念日',false,'addplan')}<div class="card"><div class="row"><button class="icon" data-month="-1">‹</button><b>${y}年${m+1}月</b><button class="icon" data-month="1">›</button></div><div class="cal">${c}</div></div><div class="section"><div class="label"><span>${selected}</span><span>所选日期</span></div><div class="card">${rows(chosen,'这一天没有计划。',planRow)}</div></div><div class="section"><div class="label"><span>PLAN POOL</span><button class="btn" data-act="addpool">＋</button></div><div class="card">${rows(data.pool,'Plan Pool 还是空的。',p=>`<div class="row"><b>${esc(p.title)}</b><div><button class="btn" data-pooldate="${p.id}">安排</button> <button class="btn" data-delpool="${p.id}">删除</button></div></div>`)}</div></div><div class="section"><div class="label"><span>ANNIVERSARY</span><button class="btn" data-act="anniv">＋</button></div><div class="card">${rows(data.anniv,'还没有纪念日。',a=>`<div class="row"><div><b>♡ ${esc(a.title)}</b><div class="muted">${a.date}</div></div><button class="btn" data-delanniv="${a.id}">删除</button></div>`)}</div></div></section>`}
function renderLife(){const ls=[...data.life].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)), mood=data.moods.filter(m=>m.date===today()).at(-1);app.innerHTML=`<section class="page">${header('Life','生活记录 · Mood · 地点 · 标签',false,'addlife')}<div class="section"><div class="label"><span>MOOD</span><span>今天</span></div><button class="moodcard" data-act="mood"><span class="moodemoji">${mood?mood.emoji:'☺'}</span><span><b>${mood?esc(mood.label):'记录今天的心情'}</b><small>${mood?.note?esc(mood.note):'心情会进入 Life 与 Archive'}</small></span><span>›</span></button></div><div class="section"><div class="label"><span>LIFE STREAM</span><span>${ls.length}</span></div><div class="card">${rows(ls,'还没有生活记录。',x=>`<div class="row"><div><b>${esc(x.text||'生活记录')}</b><div class="muted">${x.date} ${x.time||''}${x.location?' · '+esc(x.location):''}</div>${x.tags?`<div class="muted">#${esc(x.tags)}</div>`:''}</div><button class="btn" data-dellife="${x.id}">删除</button></div>`)}</div></div></section>`}
function renderArchive(){const y=archiveMonth.getFullYear(),m=archiveMonth.getMonth(),ym=`${y}-${String(m+1).padStart(2,'0')}`,ls=data.life.filter(x=>x.date.startsWith(ym)),ps=data.plans.filter(x=>x.start.startsWith(ym)||x.end.startsWith(ym)),ms=data.moods.filter(x=>x.date.startsWith(ym)),hr=data.habitRecords.filter(x=>x.date.startsWith(ym));app.innerHTML=`<section class="page">${header('Archive','按月回顾 · 从原始记录读取')}<div class="card row"><button class="icon" data-arch="-1">‹</button><b>${y}年${m+1}月</b><button class="icon" data-arch="1">›</button></div><div class="section"><div class="statgrid"><div class="stat"><span class="muted">Life</span><strong>${ls.length}</strong></div><div class="stat"><span class="muted">Plan</span><strong>${ps.length}</strong></div><div class="stat"><span class="muted">Habit</span><strong>${hr.length}</strong></div><div class="stat"><span class="muted">Mood</span><strong>${ms.length}</strong></div></div></div><div class="section"><div class="label"><span>这个月的我</span></div><div class="card">${rows(ls,'这个月还没有 Life 记录。',x=>`<div class="row"><div><b>${esc(x.text||'生活记录')}</b><div class="muted">${x.date}</div></div></div>`)}</div></div></section>`}
function annivReminder(){const md=today().slice(5),a=data.anniv.filter(x=>x.date.slice(5)===md);return a.length?a.map(x=>`<div class="row"><b>♡ ${esc(x.title)}</b><span class="pill">今天</span></div>`).join(''):'<div class="empty">今天没有额外提醒。</div>'}
function formHead(t){return `<div class="sheethead"><h2>${t}</h2><button class="icon" data-close>×</button></div>`}
function planForm(pid){const p=data.plans.find(x=>x.id===pid)||{title:'',start:selected,end:selected};open(`${formHead(pid?'编辑计划':'新建计划')}<form id="planForm"><div class="field"><label>计划</label><input name="title" required value="${esc(p.title)}"></div><div class="two"><div class="field"><label>开始日期</label><input type="date" name="start" required value="${p.start}"></div><div class="field"><label>结束日期</label><input type="date" name="end" required value="${p.end}"></div></div><button class="primary">保存</button>${pid?`<div style="height:9px"></div><button type="button" class="danger" data-delplan="${pid}">删除计划</button>`:''}</form>`);$('#planForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={id:pid||id(),title:f.get('title').trim(),start:f.get('start'),end:f.get('end'),done:p.done||false};if(obj.end<obj.start)obj.end=obj.start;if(pid)data.plans=data.plans.map(x=>x.id===pid?obj:x);else data.plans.push(obj);save();close();render();toast('已保存')}}
function habitHome(){open(`${formHead('Habit')}<div class="row"><div><b>习惯</b><div class="muted">固定 · 次数 · 弹性周期</div></div><button class="btn" data-act="addhabit">＋ 新建</button></div><div class="section"><div class="card">${rows(data.habits.filter(h=>!h.archived),'还没有习惯。',h=>`<div class="row"><div><b>${esc(h.title)}</b><div class="muted">${fmtCycle(h)} · ${habitStatus(h)}</div></div><button class="btn" data-edithabit="${h.id}">详情</button></div>`)}</div></div><div class="section"><div class="label"><span>最近 35 天</span><span>打卡热力图</span></div>${heatmap()}</div>`)}
function heatmap(){let s='<div class="heatmap">';for(let i=34;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=iso(d),n=data.habitRecords.filter(r=>r.date===ds).length;s+=`<span class="heat h${Math.min(n,3)}" title="${ds}: ${n}"></span>`}return s+'</div>'}
function habitForm(hid){const h=data.habits.find(x=>x.id===hid)||{title:'',type:'fixed',days:[],period:'week',target:3,early:2,ideal:3,late:5,paused:false,archived:false};open(`${formHead(hid?'编辑习惯':'新建习惯')}<form id="habitForm"><div class="field"><label>习惯名称</label><input name="title" required value="${esc(h.title)}"></div><div class="field"><label>打卡类型 / 周期</label><select name="type" id="habitType"><option value="fixed" ${h.type==='fixed'?'selected':''}>固定周期</option><option value="count" ${h.type==='count'?'selected':''}>次数周期</option><option value="flex" ${h.type==='flex'?'selected':''}>弹性周期</option></select></div><div id="habitOpts"></div><button class="primary">保存</button>${hid?`<div style="height:9px"></div><button type="button" class="danger" data-delhabit="${hid}">删除习惯</button>`:''}</form>`);const opts=()=>{const typ=$('#habitType').value;if(typ==='fixed')$('#habitOpts').innerHTML=`<div class="field"><label>选择打卡日（不选 = 每天）</label><div class="weekpick">${['日','一','二','三','四','五','六'].map((x,i)=>`<label><input type="checkbox" name="days" value="${i}" ${h.days?.includes(i)?'checked':''}><span>周${x}</span></label>`).join('')}</div></div>`;else if(typ==='count')$('#habitOpts').innerHTML=`<div class="two"><div class="field"><label>周期</label><select name="period"><option value="week" ${h.period==='week'?'selected':''}>每周</option><option value="month" ${h.period==='month'?'selected':''}>每月</option></select></div><div class="field"><label>打卡几次</label><input type="number" min="1" max="99" name="target" value="${h.target||3}"></div></div>`;else $('#habitOpts').innerHTML=`<div class="three"><div class="field"><label>最早</label><input type="number" min="1" name="early" value="${h.early||2}"></div><div class="field"><label>理想</label><input type="number" min="1" name="ideal" value="${h.ideal||3}"></div><div class="field"><label>最晚</label><input type="number" min="1" name="late" value="${h.late||5}"></div></div><div class="muted">例如 2 / 3 / 5 天：第 2 天起可以做，第 3 天建议做，第 5 天后显示距上次完成天数。</div>`};opts();$('#habitType').onchange=opts;$('#habitForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),typ=f.get('type'),obj={...h,id:hid||id(),title:f.get('title').trim(),type:typ,days:f.getAll('days').map(Number),period:f.get('period')||'week',target:Number(f.get('target')||3),early:Number(f.get('early')||2),ideal:Number(f.get('ideal')||3),late:Number(f.get('late')||5)};if(hid)data.habits=data.habits.map(x=>x.id===hid?obj:x);else data.habits.push(obj);save();habitHome();toast('习惯已保存')}}
function habitDetail(hid){const h=data.habits.find(x=>x.id===hid);if(!h)return;const rs=recs(h.id).sort((a,b)=>b.date.localeCompare(a.date)),monthCount=rs.filter(r=>r.date.startsWith(today().slice(0,7))).length;open(`${formHead(h.title)}<div class="card"><div class="row"><div><b>${fmtCycle(h)}</b><div class="muted">${habitStatus(h)}</div></div><button class="check ${doneOn(h.id)?'done':''}" data-checkhabit="${h.id}"></button></div></div><div class="section"><div class="statgrid"><div class="stat"><span class="muted">本月完成</span><strong>${monthCount}</strong></div><div class="stat"><span class="muted">累计完成</span><strong>${rs.length}</strong></div></div></div><div class="section"><div class="label"><span>35 天热力图</span></div>${heatmapOne(h.id)}</div><button class="primary" data-edithabitform="${h.id}">编辑习惯</button>`)}
function heatmapOne(hid){let s='<div class="heatmap">';for(let i=34;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=iso(d),n=doneOn(hid,ds)?1:0;s+=`<span class="heat h${n?2:0}"></span>`}return s+'</div>'}
function routineHome(){open(`${formHead('Routine')}<div class="row"><div><b>日常流程</b><div class="muted">时间 · 步骤 · Habit 联动</div></div><button class="btn" data-act="addroutine">＋ 新建</button></div><div class="section"><div class="card">${rows(data.routines.filter(r=>!r.archived),'还没有 Routine。',r=>`<div class="row"><div><b>${esc(r.title)}</b><div class="muted">${r.time||'未设时间'} · ${r.days?.length?r.days.map(x=>'周'+'日一二三四五六'[x]).join(' '):'每天'} · ${(r.steps||[]).length} 步</div></div><div><button class="btn" data-openroutine="${r.id}">打开</button> <button class="btn" data-editroutine="${r.id}">编辑</button></div></div>`)}</div></div>`)}
function routineForm(rid){const r=data.routines.find(x=>x.id===rid)||{title:'',time:'',days:[],steps:[]};open(`${formHead(rid?'编辑 Routine':'新建 Routine')}<form id="routineForm"><div class="field"><label>名称</label><input name="title" required value="${esc(r.title)}"></div><div class="field"><label>时间（可不填）</label><input type="time" name="time" value="${r.time||''}"></div><div class="field"><label>执行日（不选 = 每天）</label><div class="weekpick">${['日','一','二','三','四','五','六'].map((x,i)=>`<label><input type="checkbox" name="rdays" value="${i}" ${r.days?.includes(i)?'checked':''}><span>周${x}</span></label>`).join('')}</div></div><div class="field"><label>步骤（每行一个；保存后可关联 Habit）</label><textarea name="steps" placeholder="起床\n洗漱\n护肤\n早餐">${esc((r.steps||[]).map(s=>s.title).join('\n'))}</textarea></div><button class="primary">保存</button>${rid?`<div style="height:9px"></div><button type="button" class="danger" data-delroutine="${rid}">删除 Routine</button>`:''}</form>`);$('#routineForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),titles=f.get('steps').split('\n').map(x=>x.trim()).filter(Boolean),old=r.steps||[],steps=titles.map((title,i)=>({id:old[i]?.id||id(),title,habitId:old[i]?.habitId||null})),obj={...r,id:rid||id(),title:f.get('title').trim(),time:f.get('time'),days:f.getAll('rdays').map(Number),steps};if(rid)data.routines=data.routines.map(x=>x.id===rid?obj:x);else data.routines.push(obj);save();routineHome();toast('Routine 已保存')}}
function routineRun(rid){const r=data.routines.find(x=>x.id==rid);if(!r)return;const rr=routineRec(r.id),steps=r.steps||[];open(`${formHead(r.title)}<div class="card"><div class="row"><div><b>${r.time||'未设时间'}</b><div class="muted">已完成 ${rr.doneSteps.length}/${steps.length}</div></div><span class="pill">今天</span></div></div><div class="section"><div class="card">${rows(steps,'这个 Routine 还没有步骤。',(s,i)=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><button class="check ${rr.doneSteps.includes(s.id)?'done':''}" data-rstep="${r.id}|${s.id}"></button><div><b>${i+1}. ${esc(s.title)}</b><div class="muted">${s.habitId?'已关联 Habit':'普通步骤'}</div></div></div><button class="btn" data-linkhabit="${r.id}|${s.id}">${s.habitId?'更改':'关联'}</button></div>`)}</div></div><button class="primary" data-editroutine="${r.id}">编辑 Routine</button>`)}
function linkHabit(rid,sid){const r=data.routines.find(x=>x.id==rid),s=r?.steps?.find(x=>x.id==sid);if(!s)return;open(`${formHead('关联 Habit')}<div class="card"><button class="rowlink" data-sethabit="${rid}|${sid}|0">不关联 Habit</button>${data.habits.filter(h=>!h.archived).map(h=>`<button class="rowlink" data-sethabit="${rid}|${sid}|${h.id}">${esc(h.title)}${s.habitId==h.id?' ✓':''}</button>`).join('')}</div>`)}
function quick(){open(`${formHead('快速记录')}<div class="spacegrid"><button class="space" data-act="addplan">▣<b>计划</b></button><button class="space" data-act="addlife">○<b>Life</b></button><button class="space" data-act="addmemo">✎<b>备忘</b></button><button class="space" data-act="anniv">♡<b>纪念日</b></button></div>`)}
function space(){open(`${formHead('My Space')}<div class="spacegrid"><button class="space" data-act="habit">🌱<b>Habit</b></button><button class="space" data-act="routine">↻<b>Routine</b></button><button class="space" data-act="money">¥<b>Money</b></button><button class="space" data-act="health">♡<b>Health</b></button><button class="space" data-act="knowledge">▤<b>Knowledge</b></button><button class="space" data-act="backup">⚙<b>Settings</b></button></div>`)}

function mood(){open(`${formHead('Mood')}<div class="spacegrid">${[['😄','开心'],['🙂','不错'],['😐','一般'],['😔','低落'],['😤','烦躁'],['🥱','疲惫']].map(x=>`<button class="space" data-moodpick="${x[0]}|${x[1]}">${x[0]}<b>${x[1]}</b></button>`).join('')}</div><div class="field"><label>今天想记一句什么？（可不填）</label><textarea id="moodNote" placeholder="今天发生了什么……"></textarea></div><div id="moodPicked" class="muted">先选择一个心情</div>`)}

function lifeForm(){open(`${formHead('记录 Life')}<form id="lifeForm"><div class="field"><label>记录</label><textarea name="text" required></textarea></div><div class="two"><div class="field"><label>日期</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>时间</label><input type="time" name="time"></div></div><div class="field"><label>地点</label><input name="location"></div><div class="field"><label>标签</label><input name="tags" placeholder="例如：日常,朋友"></div><button class="primary">保存</button></form>`);$('#lifeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.life.push({id:id(),text:f.get('text').trim(),date:f.get('date'),time:f.get('time'),location:f.get('location'),tags:f.get('tags')});save();close();render();toast('已记录')}}
function poolForm(){open(`${formHead('加入 Plan Pool')}<form id="poolForm"><div class="field"><label>计划</label><input name="title" required></div><button class="primary">保存</button></form>`);$('#poolForm').onsubmit=e=>{e.preventDefault();data.pool.push({id:id(),title:new FormData(e.target).get('title').trim()});save();close();render()}}
function memoForm(mid){const m=data.memos.find(x=>x.id===mid)||{text:'',date:'',pinned:false,done:false};open(`${formHead(mid?'编辑备忘':'新建备忘')}<form id="memoForm"><div class="field"><label>备忘内容</label><textarea name="text" required>${esc(m.text)}</textarea></div><div class="field"><label>日期（可不填）</label><input type="date" name="date" value="${m.date||''}"></div><label class="pincheck"><input type="checkbox" name="pinned" ${m.pinned?'checked':''}> 置顶这条备忘</label><button class="primary">保存</button>${mid?`<div style="height:9px"></div><button type="button" class="danger" data-delmemo="${mid}">删除备忘</button>`:''}</form>`);$('#memoForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={...m,id:mid||id(),text:f.get('text').trim(),date:f.get('date'),pinned:f.get('pinned')==='on'};if(mid)data.memos=data.memos.map(x=>x.id===mid?obj:x);else data.memos.push(obj);save();close();render();toast('备忘已保存')}}
function memoList(){open(`${formHead('全部备忘')}<div class="card">${rows([...data.memos].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)),'还没有备忘。',m=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><button class="check ${m.done?'done':''}" data-donememo="${m.id}"></button><div><b>${m.pinned?'⌖ ':''}${esc(m.text)}</b><div class="muted">${m.done?'已完成':(m.date||'无日期')}</div></div></div><button class="btn" data-editmemo="${m.id}">编辑</button></div>`)}</div>`)}
function backup(){open(`${formHead('Settings & Backup')}<div class="card"><div class="row"><span>版本</span><b>v1.4 Today + Memo + Life Mood</b></div><div class="row"><span>数据</span><span class="muted">Local First</span></div></div><div style="height:12px"></div><button class="danger" data-reset>清空测试数据</button>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const hb=document.getElementById('heartbeat');if(hb){hb.textContent='✓ '+BUILD+' · 点击正常';hb.classList.add('ok');setTimeout(()=>hb.classList.remove('ok'),900)}if(t.dataset.page){page=t.dataset.page;render();return}if(t.id==='quickBtn'){quick();return}if(t.dataset.close!==undefined){close();return}if(t.dataset.date){selected=t.dataset.date;render();return}if(t.dataset.month){month=new Date(month.getFullYear(),month.getMonth()+Number(t.dataset.month),1);render();return}if(t.dataset.arch){archiveMonth=new Date(archiveMonth.getFullYear(),archiveMonth.getMonth()+Number(t.dataset.arch),1);render();return}if(t.dataset.toggle){const p=data.plans.find(x=>x.id==t.dataset.toggle);if(p){p.done=!p.done;save();render()}return}if(t.dataset.checkhabit){toggleHabit(Number(t.dataset.checkhabit));if(!overlay.classList.contains('hidden'))habitDetail(Number(t.dataset.checkhabit));return}if(t.dataset.edithabit){habitDetail(Number(t.dataset.edithabit));return}if(t.dataset.edithabitform){habitForm(Number(t.dataset.edithabitform));return}if(t.dataset.delhabit){const hid=Number(t.dataset.delhabit);data.habits=data.habits.filter(x=>x.id!==hid);data.habitRecords=data.habitRecords.filter(x=>x.habitId!==hid);data.routines.forEach(r=>(r.steps||[]).forEach(s=>{if(s.habitId===hid)s.habitId=null}));save();habitHome();return}if(t.dataset.openroutine){routineRun(Number(t.dataset.openroutine));return}if(t.dataset.editroutine){routineForm(Number(t.dataset.editroutine));return}if(t.dataset.delroutine){const rid=Number(t.dataset.delroutine);data.routines=data.routines.filter(x=>x.id!==rid);data.routineRecords=data.routineRecords.filter(x=>x.routineId!==rid);save();routineHome();return}if(t.dataset.rstep){const [rid,sid]=t.dataset.rstep.split('|').map(Number),r=data.routines.find(x=>x.id===rid),s=r?.steps.find(x=>x.id===sid),rr=routineRec(rid),i=rr.doneSteps.indexOf(sid);if(i>=0){rr.doneSteps.splice(i,1);if(s?.habitId){const j=data.habitRecords.findIndex(x=>x.habitId===s.habitId&&x.date===today());if(j>=0)data.habitRecords.splice(j,1)}}else{rr.doneSteps.push(sid);if(s?.habitId&&!doneOn(s.habitId))data.habitRecords.push({id:id(),habitId:s.habitId,date:today(),time:new Date().toTimeString().slice(0,5),source:'routine'})}save();routineRun(rid);return}if(t.dataset.linkhabit){const [rid,sid]=t.dataset.linkhabit.split('|').map(Number);linkHabit(rid,sid);return}if(t.dataset.sethabit){const [rid,sid,hid]=t.dataset.sethabit.split('|').map(Number),r=data.routines.find(x=>x.id===rid),s=r?.steps.find(x=>x.id===sid);if(s)s.habitId=hid||null;save();routineRun(rid);return}if(t.dataset.editplan){planForm(Number(t.dataset.editplan));return}if(t.dataset.delplan){data.plans=data.plans.filter(x=>x.id!=t.dataset.delplan);save();close();render();return}if(t.dataset.dellife){data.life=data.life.filter(x=>x.id!=t.dataset.dellife);save();render();return}if(t.dataset.delpool){data.pool=data.pool.filter(x=>x.id!=t.dataset.delpool);save();render();return}if(t.dataset.delanniv){data.anniv=data.anniv.filter(x=>x.id!=t.dataset.delanniv);save();render();return}if(t.dataset.pooldate){const p=data.pool.find(x=>x.id==t.dataset.pooldate);if(p){data.plans.push({id:id(),title:p.title,start:selected,end:selected,done:false});data.pool=data.pool.filter(x=>x.id!=p.id);save();render();toast('已安排到 '+selected)}return}if(t.dataset.moodpick){const [emoji,label]=t.dataset.moodpick.split('|'),note=$('#moodNote')?.value||'';data.moods=data.moods.filter(x=>x.date!==today());data.moods.push({id:id(),date:today(),emoji,label,note});save();close();render();toast('心情已记录');return}if(t.dataset.donememo){const m=data.memos.find(x=>x.id==t.dataset.donememo);if(m){m.done=!m.done;save();render();if(!overlay.classList.contains('hidden'))memoList()}return}if(t.dataset.editmemo){memoForm(Number(t.dataset.editmemo));return}if(t.dataset.delmemo){data.memos=data.memos.filter(x=>x.id!=t.dataset.delmemo);save();close();render();return}if(t.dataset.reset!==undefined){if(confirm('确定清空测试数据？')){localStorage.removeItem(KEY);location.reload()}return}const a=t.dataset.act;if(!a)return;if(a==='space')space();else if(a==='today'){page='today';close();render()}else if(a==='addplan'){close();planForm()}else if(a==='addlife'){close();lifeForm()}else if(a==='addpool'){poolForm()}else if(a==='mood')mood();else if(a==='addmemo')memoForm();else if(a==='memolist')memoList();else if(a==='anniv')anniv();else if(a==='habit')habitHome();else if(a==='addhabit')habitForm();else if(a==='routine')routineHome();else if(a==='addroutine')routineForm();else if(a==='money')simpleModule('Money','下一阶段接入分类、预算、小票与月度总结。');else if(a==='health')simpleModule('Health','下一阶段接入体重、生理期、运动、睡眠、步数与趋势图。');else if(a==='knowledge')simpleModule('Knowledge','下一阶段接入笔记、标签与照片上传。');else if(a==='backup')backup()});
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}if('caches'in window){caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{})}render();})();</script></body></html>
